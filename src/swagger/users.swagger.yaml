paths:
  /users:
    post:
      tags:
        - Users
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 유저 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: 이메일 중복
        "400":
          description: 유효성 검사 실패

  /users/me:
    get:
      tags:
        - Users
      summary: 내 정보 조회
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 내 유저 정보 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 인증 실패

    patch:
      tags:
        - Users
      summary: 내 정보 수정
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyInfoRequest"
      responses:
        "200":
          description: 수정된 유저 정보 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: 비밀번호 불일치 등
        "401":
          description: 인증 실패

    delete:
      tags:
        - Users
      summary: 내 계정 삭제
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 유저 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 유저 삭제 성공
        "401":
          description: 인증 실패

  /users/{userId}:
    delete:
      tags:
        - Users
      summary: 관리자 유저 삭제
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 유저 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 유저 삭제 성공
        "401":
          description: 인증 실패
        "403":
          description: 관리자 권한 필요
        "404":
          description: 존재하지 않는 유저

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - employeeNumber
        - phoneNumber
        - password
        - passwordConfirmation
        - company
        - companyCode
      properties:
        name:
          type: string
        email:
          type: string
        employeeNumber:
          type: string
        phoneNumber:
          type: string
        password:
          type: string
        passwordConfirmation:
          type: string
        company:
          type: string
        companyCode:
          type: string

    UpdateMyInfoRequest:
      type: object
      required:
        - currentPassword
      properties:
        employeeNumber:
          type: string
        phoneNumber:
          type: string
        currentPassword:
          type: string
        password:
          type: string
        passwordConfirmation:
          type: string
        imageUrl:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        employeeNumber:
          type: string
        phoneNumber:
          type: string
        imageUrl:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        company:
          type: object
          properties:
            companyCode:
              type: string
