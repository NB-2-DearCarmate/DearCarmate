customers:
  post:
    summary: 고객 등록
    tags:
      - Customers
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "홍길동"
              email:
                type: string
                example: "hong@domain.com"
              gender:
                type: string
                enum: [MALE, FEMALE]
                example: "MALE"
              phoneNumber:
                type: string
                example: "010-1234-5678"
              ageGroup:
                type: string
                example: "AGE_30"
              region:
                type: string
                example: "SEOUL"
              memo:
                type: string
                example: "VIP 고객"
              contractCount:
                type: integer
                example: 3
            required:
              - name
              - email
              - gender
              - phoneNumber
              - ageGroup
              - region
              - contractCount
    responses:
      "201":
        description: 고객 생성 성공
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      "400":
        description: 잘못된 요청입니다
      "401":
        description: 인증 실패

  get:
    summary: 고객 목록 조회
    tags:
      - Customers
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          example: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          example: 10
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          example: "홍길동"
      - name: searchBy
        in: query
        required: false
        schema:
          type: string
          enum: [name, email]
          example: "name"
    responses:
      "200":
        description: 고객 목록 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Customer"
      "401":
        description: 인증 실패

customers/{id}:
  patch:
    summary: 고객 정보 수정
    tags:
      - Customers
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "김유신"
              memo:
                type: string
                example: "프리미엄 고객"
    responses:
      "201":
        description: 고객 정보 수정 성공
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      "400":
        description: 잘못된 요청입니다
      "403":
        description: 수정 권한 없음
      "404":
        description: 고객을 찾을 수 없음

  delete:
    summary: 고객 삭제 (소프트 삭제)
    tags:
      - Customers
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    responses:
      "200":
        description: 고객 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                deletedAt:
                  type: string
                  format: date-time
                  example: "2025-05-10T15:30:00Z"
      "403":
        description: 삭제 권한 없음 또는 고객 없음
      "500":
        description: 서버 오류
        
components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "홍길동"
        email:
          type: string
          example: "hong@domain.com"
        gender:
          type: string
          enum: [MALE, FEMALE]
          example: "MALE"
        phoneNumber:
          type: string
          example: "010-1234-5678"
        ageGroup:
          type: string
          example: "AGE_30"
        region:
          type: string
          example: "SEOUL"
        memo:
          type: string
          example: "중요 고객"
        contractCount:
          type: integer
          example: 3
        createdAt:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-10T00:00:00Z"
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
