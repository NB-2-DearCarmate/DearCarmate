image:
  post:
    summary: 사용자 프로필 이미지 업로드
    description: "이미지 파일을 업로드하고, 업로드된 이미지의 URL을 반환합니다."
    operationId: uploadImage
    tags:
      - Image Upload
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
                description: "이미지 파일 (JPEG, PNG 형식)"
    responses:
      "200":
        description: "이미지 업로드 성공"
        content:
          application/json:
            schema:
              type: object
              properties:
                imageUrl:
                  type: string
                  example: "http://localhost:3001/photos/1234567890.png"
      "400":
        description: "잘못된 요청 - 파일 형식 오류 또는 파일 크기 초과"
      "500":
        description: "서버 오류"