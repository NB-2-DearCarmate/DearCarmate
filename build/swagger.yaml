openapi: 3.0.0
info:
  title: DearCarmate API
  version: 1.0.0
  description: DearCarmate 프로젝트 - API 문서
servers:
  - url: 'http://localhost:3000'
paths:
  /companies:
    paths:
      /companies:
        post:
          tags:
            - Company
          summary: Create a new company in dearCarmate
          description: Registers a new company
          operationId: addCompany
          requestBody:
            description: 회사 등록에 필요한 정보
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    name:
                      type: string
                      example: dearCarmate
                    address:
                      type: string
                      example: 서울특별시 강남구
                    phone:
                      type: string
                      example: 02-1234-5678
          responses:
            '201':
              description: 회사 등록 성공
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 201
                      message:
                        type: string
                        example: 회사가 성공적으로 등록되었습니다.
            '400':
              description: 잘못된 요청
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: 요청이 잘못되었습니다.
